<aside class="task-details" [class.task-details_completed]="task().completed" #details>

  <div class="task-details__content">
    <div class="task-details__header">
      <div class="task-details__meta">
        @if (task().deadline) {
          <div class="task-details__deadline" [appTooltip]="'Дедлайн: ' + (task().deadline | date: 'd MMMM HH:mm')"
               [class.task-details__deadline_expired]="isDeadlineExpired(task().deadline)">{{ task().deadline | taskDeadline }}
          </div>
        }

        <button type="button"
                [ngClass]="[
          'task-details__priority',
          (task().priority ? 'task-details__priority_' + task().priority : '')
          ]"
                [appTooltip]="task().priority | taskPriority">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"
               stroke-width="1.5" class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M3 3v1.5M3 21v-6m0 0 2.77-.693a9 9 0 0 1 6.208.682l.108.054a9 9 0 0 0 6.086.71l3.114-.732a48.524 48.524 0 0 1-.005-10.499l-3.11.732a9 9 0 0 1-6.085-.711l-.108-.054a9 9 0 0 0-6.208-.682L3 4.5M3 15V4.5"
                  stroke-width="1.6" />
          </svg>
        </button>
      </div>
      <button class="task-details__close" type="button" (click)="close()" appTooltip="Скрыть">
        <img src="images/icons/cross.svg" alt="Cross">
      </button>
    </div>
    <h2 class="task-details__title">{{ task().title }}</h2>
    <div class="task-details__description">
      {{ task().description }}
    </div>
  </div>

  <div class="task-details__footer">
    <div class="task-details__created">
      Создано: {{ task().createdAt | date:"d MMMM 'в' HH:mm" }}
    </div>
    <button class="task-details__delete" type="button" appTooltip="Удалить" (click)="delete()">
      <img src="images/icons/trash.svg" alt="Trash">
    </button>
  </div>

</aside>
